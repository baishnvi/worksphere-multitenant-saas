version: '3.8'

services:
  # 1. PostgreSQL Database with Persistent Storage
  postgres:
    image: postgres:16-alpine
    container_name: worksphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: worksphere_user
      POSTGRES_PASSWORD: worksphere_pass
      POSTGRES_DB: worksphere_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - worksphere-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worksphere_user -d worksphere_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Caching & Job Queue Broker
  redis:
    image: redis:7-alpine
    container_name: worksphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - worksphere-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Python FastAPI Analytics Service
  analytics-service:
    build:
      context: ../analytics-service
      dockerfile: ../devops/Dockerfile.analytics
    container_name: worksphere-analytics
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ANALYTICS_SERVICE_API_KEY=ws_internal_service_key_998877
    networks:
      - worksphere-network

  # 4. Core Express API Backend
  backend:
    build:
      context: ../backend
      dockerfile: ../devops/Dockerfile.backend
    container_name: worksphere-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      analytics-service:
        condition: service_started
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://worksphere_user:worksphere_pass@postgres:5432/worksphere_db?schema=public
      - JWT_ACCESS_SECRET=worksphere_super_secret_access_jwt_key_2026!
      - JWT_REFRESH_SECRET=worksphere_super_secret_refresh_jwt_key_2026!
      - ANALYTICS_SERVICE_URL=http://analytics-service:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - worksphere-network

  # 5. Next.js Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: ../devops/Dockerfile.frontend
    container_name: worksphere-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
      - NEXT_PUBLIC_WS_URL=http://localhost:5000
      - NEXT_PUBLIC_ANALYTICS_URL=http://localhost:8000
    networks:
      - worksphere-network

networks:
  worksphere-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
