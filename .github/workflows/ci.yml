name: WorkSphere CI/CD Quality Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Node.js Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Dependencies
        run: |
          cd backend
          npm ci
      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate
      - name: Run Backend Tests
        run: |
          cd backend
          npm test -- --passWithNoTests

  analytics-tests:
    name: Python FastAPI Microservice E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          cd analytics-service
          pip install -r requirements.txt
      - name: Run Pytest Suite
        run: |
          cd analytics-service
          pytest tests/ -v

  frontend-build:
    name: Next.js Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: |
          cd frontend
          npm ci
      - name: Build Next.js Production Bundle
        run: |
          cd frontend
          npm run build
